<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17121f">
<title>مشاهدة الفيديو | مطبعة الإتقان</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#100d16;color:#fff;font-family:Arial,Tahoma,sans-serif}body{min-height:100dvh;display:flex;flex-direction:column}
header{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#21182d;border-bottom:1px solid #ffffff20}.back{border:0;border-radius:12px;background:#7650b8;color:white;padding:10px 16px;text-decoration:none;font-weight:700}.brand{font-size:17px;font-weight:800}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px;gap:16px}.player-wrap{width:min(100%,1100px);height:min(76dvh,760px);display:flex;align-items:center;justify-content:center;background:#08060b;border-radius:14px;overflow:hidden}video{display:block;width:100%;height:100%;object-fit:contain;background:#08060b}
.action{border:1px solid #ffffff35;border-radius:10px;background:#ffffff16;color:white;padding:10px 16px;cursor:pointer}#error{display:none;text-align:center;color:#ffd3d3;line-height:1.8}
@media(max-width:600px){header{height:58px;flex-basis:58px}.brand{font-size:15px}.player-wrap{width:100%;height:calc(100dvh - 150px);border-radius:8px}main{padding:12px 8px;gap:12px}}
</style>
</head>
<body>
<header><div class="brand">الإتقان · للدعاية والإعلان</div><a class="back" href="index.html#portfolio">العودة للمعرض</a></header>
<main><div class="player-wrap"><video id="player" controls playsinline preload="metadata"></video></div><button class="action" id="fullscreen" type="button">ملء الشاشة</button><p id="error">تعذر تحميل الفيديو. تحقق من اتصالك ثم أعد المحاولة.</p></main>
<script>
const allowed=["VID-20261116-WA0004.mp4","VID-20261116-WA0011.mp4"];
const requested=new URLSearchParams(location.search).get("v");
const player=document.getElementById("player");
const error=document.getElementById("error");
if(allowed.includes(requested)){player.src="assests/"+requested;player.load();player.addEventListener("error",()=>{error.style.display="block";});}else{error.textContent="الفيديو المطلوب غير موجود.";error.style.display="block";}
document.getElementById("fullscreen").addEventListener("click",async()=>{try{if(player.requestFullscreen)await player.requestFullscreen();else if(player.webkitEnterFullscreen)player.webkitEnterFullscreen();}catch(e){}});
</script>
</body>
</html>
